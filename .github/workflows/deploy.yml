name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Gemini API Key from Secrets
        shell: bash
        run: |
          KEY="${{ secrets.GEMINI_API_KEY }}"
          if [ -n "$KEY" ]; then
            if [ -f "config.js" ]; then
              sed -i "s/__GEMINI_API_KEY__/$KEY/g" config.js
            elif [ -f "well-be-mockup/config.js" ]; then
              sed -i "s/__GEMINI_API_KEY__/$KEY/g" well-be-mockup/config.js
            fi
            echo "Gemini API key injected successfully."
          else
            echo "No GEMINI_API_KEY secret provided. Site will run in offline mock fallback mode."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
